<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>再见？爱人！ · 3D 医院辨认 Demo</title>
<link rel="stylesheet" href="css/style.css?v=gml23-cachebust">
<meta name="theme-color" content="#080b10">
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
</head>
<body tabindex="-1">
<div id="stage">
  <canvas id="game" aria-label="3D 游戏画面"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="split-line" aria-hidden="true"></div>
  <div class="vision-haze vision-haze-a" id="vision-haze-a" aria-hidden="true"></div>
  <div class="vision-haze vision-haze-b" id="vision-haze-b" aria-hidden="true"></div>

  <div class="hud hud-left" id="hud-left">
    <div class="hud-tag">A</div>
    <div class="hud-row"><span>生命</span><div class="bar"><i id="bar-inf-a"></i></div><b id="num-inf-a">100</b></div>
    <div class="heart" id="heart-a">心率 60 · 平稳</div>
    <div class="hud-row"><span>体力</span><div class="bar bar-h"><i id="bar-hum-a"></i></div><b id="num-hum-a">100</b></div>
    <div class="hud-foot" id="hud-foot-a">一楼 · 未取得手机</div>
    <canvas class="minimap" id="map-a" width="220" height="110" aria-label="A 已探索地图"></canvas>
    <div class="phone" id="phone-a">手机未取得</div>
    <div class="clue" id="clue-a">外貌线索：尚未发现</div>
    <div class="task" id="task-a">主线：找到对方</div>
    <div class="control-hint" id="controls-a">键盘 WASD 移动 · 拖动鼠标视角 · V 切换视角</div>
    <div class="feed" id="feed-a"></div>
  </div>

  <div class="hud hud-right" id="hud-right">
    <div class="hud-tag">B</div>
    <div class="hud-row"><span>生命</span><div class="bar"><i id="bar-inf-b"></i></div><b id="num-inf-b">100</b></div>
    <div class="heart heart-right" id="heart-b">心率 60 · 平稳</div>
    <div class="hud-row"><span>体力</span><div class="bar bar-h"><i id="bar-hum-b"></i></div><b id="num-hum-b">100</b></div>
    <div class="hud-foot" id="hud-foot-b">一楼 · 未取得手机</div>
    <canvas class="minimap" id="map-b" width="220" height="110" aria-label="B 已探索地图"></canvas>
    <div class="phone" id="phone-b">手机未取得</div>
    <div class="clue" id="clue-b">外貌线索：尚未发现</div>
    <div class="task task-right" id="task-b">主线：找到对方</div>
    <div class="control-hint control-hint-right" id="controls-b">等待手柄 · 左摇杆移动 · 右摇杆视角 · Y 切换视角</div>
    <div class="feed feed-right" id="feed-b"></div>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="subtitles" class="subtitles"></div>

  <div id="loading" class="loading"><div class="loading-inner">正在点亮医院…<small>加载场景与角色模型</small></div></div>

  <div id="overlay" class="overlay">
    <img id="bg-img" class="bg-art" alt="" decoding="async">
    <div class="card" id="card"></div>
  </div>
  <div id="flash" class="flash"></div>
  <div id="still" class="still" aria-hidden="true"><img id="still-img" alt="" decoding="async"></div>
</div>

<script src="data/config.js?v=gml23-cachebust"></script>
<script src="data/script.js?v=gml23-cachebust"></script>
<script src="js/core.js?v=gml23-cachebust"></script>
<script src="js/world.js?v=gml23-cachebust"></script>
<script src="js/input.js?v=gml23-cachebust"></script>
<script src="js/render.js?v=gml23-cachebust"></script>
<script src="js/audio.js?v=gml23-cachebust"></script>
<script src="js/systems.js?v=gml23-cachebust"></script>
<script src="js/recognition.js?v=gml23-cachebust"></script>
<script src="js/levels.js?v=gml23-cachebust"></script>
<script src="js/beam.js?v=gml23-cachebust"></script>
<script src="js/hazard.js?v=gml23-cachebust"></script>
<script src="js/ui.js?v=gml23-cachebust"></script>
<script src="js/hospital-demo.js?v=gml23-cachebust"></script>
<script src="js/boot.js?v=gml23-cachebust"></script>
<script type="module" src="js/render-three.js?v=gml23-cachebust"></script>
</body>
</html>
