<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>眼中皆是你 · 恐怖 / 即时动作 / 马</title>
<style>
/* 眼中皆是你 · 纯静态零依赖样式 */
:root{
  --bg:#07090c; --ink:#d8d2c4; --dim:#7d7a72; --line:#2a2d30;
  --red:#b4453c; --amber:#c8a15a; --cold:#6f8a91;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0d1116 0%,#050608 78%)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

#grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)}
#split-line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(200,161,90,.35) 20%,rgba(200,161,90,.35) 80%,transparent);
  pointer-events:none;z-index:4;box-shadow:0 0 22px rgba(0,0,0,.9)}
#split-line.off{display:none}

.hud{position:absolute;top:18px;z-index:6;font-size:11px;letter-spacing:.08em;color:var(--dim);width:210px;pointer-events:none}
.hud-left{left:22px}
.hud-right{right:22px;text-align:right}
.hud-right.off,.hud-left.off{display:none}
.hud-tag{font-size:12px;color:var(--amber);letter-spacing:.24em;margin-bottom:10px;text-shadow:0 0 14px rgba(200,161,90,.3)}
.hud-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.hud-right .hud-row{flex-direction:row-reverse}
.hud-row span{width:26px;flex:none}
.hud-row b{width:28px;font-weight:400;font-variant-numeric:tabular-nums;flex:none}
.bar{flex:1;height:3px;background:#1b1e21;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--red);transition:width .25s linear}
.bar-h i{background:var(--cold)}
.hud-foot{margin-top:9px;color:#565852;font-variant-numeric:tabular-nums}

.prompt{position:absolute;left:50%;top:11%;transform:translateX(-50%);z-index:7;text-align:center;
  font-size:13px;letter-spacing:.18em;color:var(--amber);text-shadow:0 0 18px rgba(200,161,90,.35);
  pointer-events:none;white-space:nowrap;transition:opacity .3s}
.subtitles{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:7;width:min(760px,86vw);
  text-align:center;font-size:17px;line-height:1.9;letter-spacing:.12em;color:#e5dfd1;
  text-shadow:0 2px 14px #000,0 0 30px #000;pointer-events:none}
.subtitles .who{color:var(--cold);font-size:13px;letter-spacing:.2em}
.subtitles .onomat{color:var(--dim);font-style:italic;letter-spacing:.3em}
.subtitles .line{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.qte{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:8;width:min(520px,80vw);
  background:rgba(8,10,13,.9);border:1px solid var(--line);padding:16px 20px 14px;
  box-shadow:0 12px 60px rgba(0,0,0,.8)}
.qte.hidden{display:none}
.qte-title{font-size:12px;letter-spacing:.2em;color:var(--amber);margin-bottom:14px;display:flex;justify-content:space-between}
.qte-title span{color:var(--dim);letter-spacing:.08em}
.qte-track{position:relative;height:34px;background:#111418;border-left:1px solid #333;border-right:1px solid #333}
.qte-beats{position:absolute;inset:0}
.qte-beat{position:absolute;top:5px;width:9px;height:24px;margin-left:-4px;background:#4a4034;border-radius:1px}
.qte-beat.hit{background:var(--amber);box-shadow:0 0 14px rgba(200,161,90,.7)}
.qte-beat.miss{background:var(--red)}
.qte-beat.echo{background:#31363a;border:1px dashed #55555a}
.qte-cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);left:0;z-index:2;box-shadow:0 0 10px var(--amber)}
.qte-hint{margin-top:10px;font-size:11px;color:var(--dim);letter-spacing:.1em;min-height:16px}

.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(3,4,6,.88);backdrop-filter:blur(3px);padding:24px}
.overlay.show{display:flex}
.card{max-width:min(720px,92vw);text-align:center;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h1{font-size:clamp(28px,5vw,52px);font-weight:300;letter-spacing:.34em;margin:0 0 10px;color:#e8e1d2;text-shadow:0 0 40px rgba(200,161,90,.25)}
.card h2{font-size:20px;font-weight:300;letter-spacing:.24em;color:var(--amber);margin:0 0 26px}
.card .sub{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:28px}
.card p{font-size:14px;line-height:2.1;color:#b9b4a9;margin:10px 0;letter-spacing:.06em}
.card .keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px;text-align:left;
  margin:24px auto 26px;max-width:560px;font-size:12px;color:#a5a096;line-height:1.8}
.card .keys b{color:var(--amber);font-weight:500;letter-spacing:.1em}
.card .go{font-size:13px;letter-spacing:.28em;color:var(--amber);animation:blink 1.8s ease-in-out infinite;margin-top:8px}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
.card .ending{font-size:13px;line-height:2.2;color:#b9b4a9;max-width:560px;margin:0 auto 22px}
.card .stat{font-size:11px;color:#6d6a62;letter-spacing:.14em;margin-top:16px;font-variant-numeric:tabular-nums}
.card .opt{display:inline-block;border:1px solid #3a3d40;padding:10px 18px;margin:6px;color:#c9c3b5;font-size:12px;letter-spacing:.12em}
.card .opt b{color:var(--amber)}
.flash{position:absolute;inset:0;z-index:15;pointer-events:none;background:#000;opacity:0;transition:opacity .12s}
.flash.on{opacity:.55}
body.present #grain{opacity:.08}
body.present #game{filter:contrast(1.12) brightness(1.16)}
@media (max-aspect-ratio:1/1){.hud{width:150px;font-size:10px}.subtitles{font-size:14px}}

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="游戏画面"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="split-line" aria-hidden="true"></div>

  <div class="hud hud-left" id="hud-left">
    <div class="hud-tag">A · 人马</div>
    <div class="hud-row"><span>感染</span><div class="bar"><i id="bar-inf-a"></i></div><b id="num-inf-a">0</b></div>
    <div class="hud-row"><span>人性</span><div class="bar bar-h"><i id="bar-hum-a"></i></div><b id="num-hum-a">100</b></div>
    <div class="hud-foot" id="hud-foot-a">血清 ×2 · 00:00</div>
  </div>

  <div class="hud hud-right" id="hud-right">
    <div class="hud-tag">B · 木乃伊</div>
    <div class="hud-row"><span>感染</span><div class="bar"><i id="bar-inf-b"></i></div><b id="num-inf-b">0</b></div>
    <div class="hud-row"><span>人性</span><div class="bar bar-h"><i id="bar-hum-b"></i></div><b id="num-hum-b">100</b></div>
    <div class="hud-foot" id="hud-foot-b">共用一条命</div>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="subtitles" class="subtitles"></div>

  <div id="qte" class="qte hidden">
    <div class="qte-title">暗号 · 三短一长 <span id="qte-sub">跟着亮点敲</span></div>
    <div class="qte-track"><div class="qte-cursor" id="qte-cursor"></div><div class="qte-beats" id="qte-beats"></div></div>
    <div class="qte-hint" id="qte-hint"></div>
  </div>

  <div id="overlay" class="overlay">
    <div class="card" id="card"></div>
  </div>
  <div id="flash" class="flash"></div>
</div>

<script>
/* 全部数值集中在此；file:// 下不依赖 fetch，直接挂到 G.DATA */
(function () {
  var G = window.G = window.G || {};
  G.DATA = G.DATA || {};
  G.DATA.config = {
    step: 1 / 60,
    world: { w: 2400, h: 980, pad: 60 },
    view: { duoWidth: 1020, soloWidth: 1420, aspectKeep: true },
    speed: { p1: 205, p2: 178, dash: 540, dashTime: .28, dashCd: 1.1 },
    infection: {
      base: 1.15, dash: 3, touch: 8, mistake: 12, serum: -35,
      accelerateAt: 240, accelerateMul: 1.8, max: 100
    },
    humanity: { start: 100, mistake: -15, abandon: -25, correct: 10, give: 20, block: 8 },
    noBack: { free: 30, sideOnly: 60 },
    qte: {
      window: .18,
      pattern: [0, .26, .52, 1.02],       // 三短一长
      echoDelay: .55,                     // 半拍 + 0.30s
      echoTolerance: .11,
      echoMax: 2,
      lead: 1.1                           // 起拍前的准备时间
    },
    silence: { short: 1.5, long: 2.0 },
    timeline: {
      silence1: 50, candidates: 70, lock: 80, silence2: 170,
      qte: 140, verify: 200, mapShift: 220, escape: 240, choice: 280, hardEnd: 300
    },
    serum: { count: 2 },
    recognition: { candidateCount: 5 },
    colors: {
      bg: '#0a0f14', wall: '#1c262f', floor: '#16202a', ink: '#d8d2c4',
      amber: '#c8a15a', red: '#b4453c', cold: '#6f8a91', silhouette: '#04080c',
      rim: 'rgba(158,186,198,.62)'
    }
  };
})();

</script>

<script>
/* 命名空间 / 工具 / 事件总线 / 状态机 / 固定步长循环 / 游戏总控 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config, S = G.DATA.script;

  /* ---------- utils ---------- */
  var U = G.utils = {
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    dist: function (a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); },
    now: function () { return performance.now() / 1000; },
    fmt: function (t) {
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    },
    rnd: function (seed) {
      var x = seed || 1;
      return function () { x = (x * 1664525 + 1013904223) % 4294967296; return x / 4294967296; };
    },
    el: function (id) { return document.getElementById(id); }
  };

  /* ---------- events ---------- */
  var listeners = {};
  G.Events = {
    on: function (name, fn) { (listeners[name] = listeners[name] || []).push(fn); },
    emit: function (name, payload) {
      (listeners[name] || []).forEach(function (fn) { try { fn(payload); } catch (e) { console.warn('[event]', name, e); } });
    }
  };

  /* ---------- state machine ---------- */
  var State = G.State = {
    current: 'BOOT',
    set: function (name) {
      if (State.current === name) return;
      var prev = State.current;
      State.current = name;
      G.Events.emit('phase', { from: prev, to: name });
    }
  };

  /* ---------- loop ---------- */
  var Loop = G.Loop = {
    acc: 0, last: 0, running: false, fps: 60, frames: 0, fpsT: 0,
    start: function () {
      if (Loop.running) return;
      Loop.running = true;
      Loop.last = performance.now();
      requestAnimationFrame(Loop.frame);
    },
    frame: function (t) {
      var dt = Math.min((t - Loop.last) / 1000, .25);
      Loop.last = t;
      Loop.acc += dt;
      var presses = G.Input.drain();
      for (var i = 0; i < presses.length; i++) G.Game.onPress(presses[i]);
      while (Loop.acc >= C.step) {
        G.Game.update(C.step);
        Loop.acc -= C.step;
      }
      G.Renderer.renderAll(Loop.acc / C.step);
      Loop.frames++;
      if (t - Loop.fpsT > 1000) { Loop.fps = Loop.frames; Loop.frames = 0; Loop.fpsT = t; }
      requestAnimationFrame(Loop.frame);
    }
  };

  /* ---------- game controller ---------- */
  var Game = G.Game = {
    world: null,
    mode: 'solo',              // solo | duo
    dualView: false,           // 单机下 V 键开启双屏观察
    debugTruth: false,
    present: false,
    init: function () {
      G.Input.attach();
      G.Renderer.resize();
      G.UI.init();
      window.addEventListener('resize', function () { G.Renderer.resize(); });
      document.addEventListener('visibilitychange', function () { G.Audio.visibility(document.hidden); });
      State.set('TITLE');
      G.UI.overlay('title');
      Loop.start();
    },
    reset: function (mode) {
      Game.mode = mode || 'solo';
      Game.dualView = false;
      Game.debugTruth = false;
      Game.world = G.World.create();
      G.Level.build(Game.world);
      G.Recognition.reset(Game.world);
      G.Infection.reset(Game.world);
      G.Subtitles.clear();
      G.UI.overlay(null);
      G.Audio.unlock();
      G.Audio.startAmbient();
      State.set('PLAY');
      G.Subtitles.push(S.lines.wake, 'narration', 4);
      G.Events.emit('reset', Game.world);
    },
    onPress: function (ev) {
      var w = Game.world, ph = State.current;
      if (ph === 'TITLE') { G.Audio.unlock(); State.set('BRIEF'); G.UI.overlay('brief'); return; }
      if (ph === 'BRIEF') {
        if (ev.code === 'Digit1' || ev.code === 'Numpad1') Game.reset('solo');
        else if (ev.code === 'Digit2' || ev.code === 'Numpad2') Game.reset('duo');
        return;
      }
      if (ph === 'RESULT') {
        if (ev.code === 'KeyR' || ev.code === 'Space' || ev.code === 'Enter' || ev.code === 'Escape') {
          State.set('TITLE'); G.UI.overlay('title');
        }
        return;
      }
      if (ph === 'CHOICE') {
        if (/^(Digit|Numpad)[123]$/.test(ev.code)) Game.choose(parseInt(ev.code.slice(-1), 10));
        return;
      }
      if (Game.systemKey(ev)) return;
      G.Movement.onPress(w, ev);
      G.Recognition.onPress(w, ev);
    },
    systemKey: function (ev) {
      var w = Game.world;
      switch (ev.code) {
        case 'Escape': State.set('TITLE'); G.UI.overlay('title'); return true;
        case 'Tab':
          if (Game.mode === 'solo') {
            w.controlled = w.controlled === 'p1' ? 'p2' : 'p1';
            G.Subtitles.push('[接管] ' + (w.controlled === 'p1' ? 'A · 人马' : 'B · 木乃伊'), 'system', 1.6);
          }
          return true;
        case 'KeyV':
          Game.dualView = !Game.dualView;
          G.Subtitles.push(Game.dualView ? '[双屏观察] 开' : '[双屏观察] 关', 'system', 1.4);
          return true;
        case 'KeyM': G.Audio.muteAll(C.silence.long); return true;
        case 'KeyH': Game.debugTruth = !Game.debugTruth; return true;
        case 'KeyT':   // 展演快进：同步进入相认阶段
          if (w) {
            w.p1.x = 620; w.p1.y = 500;
            w.time = Math.max(w.time, C.timeline.candidates + 1);
            G.Recognition.begin(w);
          }
          return true;
        case 'KeyY':   // 展演快进：跳到登船抉择（补齐演示条件）
          if (w) {
            w.serum = Math.max(w.serum, 1);
            w.qte.active = false; G.UI.hideQTE();
            if (w.lockedId === w.suspectId && !w.flags.wrongPerson) {
              w.flags.recognized = true;
              G.Subtitles.push('[展演] 暗号已对上。', 'system', 2);
            }
            G.Recognition.forceVerify(w); G.Timeline.toChoice(w);
          }
          return true;

    update: function (dt) {
      var w = Game.world, ph = State.current;
      var live = (ph === 'PLAY' || ph === 'RECOGNIZE' || ph === 'QTE' || ph === 'VERIFY' || ph === 'ESCAPE');
      if (w && live) {
        w.time += dt;
        G.Movement.update(w, dt);
        G.AI.update(w, dt);
        G.Infection.update(w, dt);
        G.Horror.update(w, dt);
        G.Timeline.update(w, dt);
        G.Recognition.update(w, dt);
        G.Audio.update(w, dt);

      }
      G.Subtitles.update(dt);
      if (w) G.UI.update(w);
    },
    checkEnd: function (w) {
      if (State.current === 'RESULT' || w.flags.ending) return;
      if (w.infection >= C.infection.max) return Game.end('horse');
      if (w.time >= C.timeline.hardEnd && !w.flags.boarded) return Game.end('timeout');

    choose: function (n) {

      if (n === 2) { w.humanity += C.humanity.abandon; G.Infection.applyMistake(w, true); return Game.end('alone'); }
      if (n === 3) { w.humanity += C.humanity.give; return Game.end(ok ? 'stay' : 'wrong'); }
      if (w.serum < 1) return Game.end('horse');       // 没找到血清 → 恢复不了人形

    },

})();

<script>
/* 唯一世界状态 + 实体工厂 + 感知投影层 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config;

  /* ---------- entity factory ---------- */
  var uid = 0;
  var Entities = G.Entities = {
    make: function (o) {
      var e = {
        id: o.id || ('e' + (++uid)), kind: o.kind || 'prop',
        x: o.x || 0, y: o.y || 0, vx: 0, vy: 0,
        r: o.r || 20, speed: o.speed || 0,
        facing: { x: 1, y: 0 }, moving: false, alive: true,
        trueForm: o.trueForm || 'human',
        isLover: !!o.isLover, isFake: !!o.isFake,
        ghostP1: !!o.ghostP1, ghostP2: !!o.ghostP2,
        blink: o.blink || 0, phase: Math.random() * 6.28,
        label: o.label || '', locked: false, follower: !!o.follower,
        dashT: 0, dashCd: 0, hitCd: 0
      };
      return e;
    },
    player: function (id, x, y, form, speed) {
      var e = Entities.make({ id: id, kind: 'player', x: x, y: y, trueForm: form, r: 22, speed: speed });
      e.role = id;
      return e;
    }
  };

  /* ---------- world ---------- */
  G.World = {
    create: function () {
      var p1 = Entities.player('p1', 170, 500, 'centaur', C.speed.p1);
      var p2 = Entities.player('p2', 250, 560, 'mummy', C.speed.p2);
      return {
        time: 0, infection: 0, humanity: C.humanity.start, serum: C.serum.count,
        entities: [p1, p2], byId: { p1: p1, p2: p2 },
        p1: p1, p2: p2, controlled: 'p1',
        walls: [], puddles: [], props: [], zones: [],
        rocket: { x: 2230, y: 490, w: 120, h: 210 },
        candidates: [], suspectId: null, lockedId: null, followers: [],
        flags: {
          recognized: false, wrongPerson: false, truth: false,
          mapShifted: false, boarded: false, mirrorReveal: false,
          silenceFlash: false, escape: false
        },
        recog: { stage: 'IDLE', p1Pick: 0, p2Pick: 0, aiK: 0, attempts: 0, mistakes: 0, verifyDone: false },
        qte: { active: false, idx: 0, t0: 0, echoFollow: 0, echoAt: [], targetIsFake: false, result: null },
        horror: { done: {}, hoofT: 0, flicker: 0 },
        subs: [], prompt: '', aiReport: null, silencedUntil: 0,
        stat: { dashes: 0, hits: 0, mistakes: 0 }
      };
    },
    add: function (w, e) { w.entities.push(e); w.byId[e.id] = e; return e; },
    playerOf: function (w, role) { return role === 'p1' ? w.p1 : w.p2; },
    controlled: function (w) { return w.controlled === 'p1' ? w.p1 : w.p2; },
    living: function (w, kind) {
      return w.entities.filter(function (e) { return e.alive && (!kind || e.kind === kind); });
    }
  };

  /* ---------- perception: 同一 world，两套视觉 ---------- */
  /* 铁律：只改「画成什么」，绝不改坐标 / id / 碰撞 / 感染 */
  G.Perception = {
    ACTOR_KINDS: { player: 1, candidate: 1, zombie: 1, follower: 1 },
    project: function (w, mode, viewerId) {
      var truth = (mode === 'truth') || G.Game.debugTruth || w.flags.truth;
      var out = [];
      for (var i = 0; i < w.entities.length; i++) {
        var e = w.entities[i];
        if (!e.alive || !G.Perception.ACTOR_KINDS[e.kind]) continue;
        var self = (e.id === viewerId);
        var shape;
        if (truth) shape = e.trueForm;
        else if (self) shape = (viewerId === 'p1' ? 'centaur' : 'mummy');
        else shape = (mode === 'mummy' ? 'centaur' : 'mummy');
        var ghost = 0;
        if (mode === 'centaur' && e.ghostP1) ghost = 1;
        if (mode === 'mummy' && e.ghostP2) ghost = 1;
        var apparent = !!e.moving || !!ghost;
        out.push({
          id: e.id, ref: e, x: e.x, y: e.y, r: e.r, shape: shape,
          self: self, moving: !!e.moving, ghost: ghost, apparentMoving: apparent,
          isLover: e.isLover, isFake: e.isFake, locked: e.locked,
          follower: e.follower, trueForm: e.trueForm, phase: e.phase,
          alpha: e.hitCd > 0 ? .55 : 1,
          facing: e.facing
        });
      }
      return out;
    },
    /* 视角相关的「在动」序列：P2 侧顺序反过来 —— 相认技巧②的信息差来源 */
    movers: function (w, mode) {
      var list = G.Perception.project(w, mode, mode === 'mummy' ? 'p2' : 'p1')
        .filter(function (a) { return a.ref.kind === 'candidate' && a.apparentMoving; });
      list.sort(function (a, b) {
        var ka = a.x + a.y * .0001, kb = b.x + b.y * .0001;
        return mode === 'mummy' ? kb - ka : ka - kb;
      });
      return list;
    }
  };
})();

<script>
/* 键位表 + 输入缓冲环（按键带时间戳，QTE 判定与帧率解耦） */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config;

  var MAP = {
    KeyW: 'p1', KeyA: 'p1', KeyS: 'p1', KeyD: 'p1',
    KeyQ: 'p1', KeyF: 'p1', Space: 'p1', ShiftLeft: 'p1', KeyR: 'p1',
    ArrowUp: 'p2', ArrowDown: 'p2', ArrowLeft: 'p2', ArrowRight: 'p2',
    KeyE: 'p2', Enter: 'p2', ShiftRight: 'p2',
    Tab: 'sys', KeyV: 'sys', KeyM: 'sys', KeyH: 'sys', KeyP: 'sys',
    Escape: 'sys', Digit1: 'sys', Digit2: 'sys', Digit3: 'sys',
    Numpad1: 'sys', Numpad2: 'sys', Numpad3: 'sys'
  };
  var BLOCK = { Space: 1, Tab: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Enter: 1 };

  var Input = G.Input = {
    down: {}, presses: [], buffer: [],
    attach: function () {
      window.addEventListener('keydown', function (e) {
        if (BLOCK[e.code]) e.preventDefault();
        if (e.repeat) return;                        // 重复判断交给浏览器：避免丢 keyup 后该键被永久吞掉
        Input.down[e.code] = true;
        var ev = { code: e.code, owner: MAP[e.code] || 'sys', t: performance.now() / 1000 };
        Input.presses.push(ev);
        Input.buffer.push(ev);
        if (Input.buffer.length > 64) Input.buffer.shift();
      });
      window.addEventListener('keyup', function (e) { Input.down[e.code] = false; });
      window.addEventListener('blur', function () { Input.down = {}; });
      window.addEventListener('pointerdown', function () { G.Audio.unlock(); });
    },
    isDown: function (code) { return !!Input.down[code]; },
    ownerOf: function (code) { return MAP[code] || 'sys'; },
    drain: function () { var p = Input.presses; Input.presses = []; return p; },
    takeBufferSince: function (t) {
      return Input.buffer.filter(function (e) { return e.t >= t; });
    },
    /* 移动向量：返回归一化前的原始方向 */
    axis: function (role) {
      var x = 0, y = 0;
      if (role === 'p1') {
        if (Input.isDown('KeyA')) x -= 1;
        if (Input.isDown('KeyD')) x += 1;
        if (Input.isDown('KeyW')) y -= 1;
        if (Input.isDown('KeyS')) y += 1;
      } else {
        if (Input.isDown('ArrowLeft')) x -= 1;
        if (Input.isDown('ArrowRight')) x += 1;
        if (Input.isDown('ArrowUp')) y -= 1;
        if (Input.isDown('ArrowDown')) y += 1;
      }
      var len = Math.sqrt(x * x + y * y);
      if (len > 0) { x /= len; y /= len; }
      return { x: x, y: y, len: len };
    }
  };
})();

<script>
/* 程序化剪影 / 雾与光照 / 单 canvas 双 viewport / 水坑 truth 倒影 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config, U = G.utils, COL = C.colors;
  var canvas, ctx, W = 0, H = 0, dpr = 1, tile = null;

  function makeTile() {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = COL.floor; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(140,170,185,.10)'; g.lineWidth = 1;
    for (var i = 0; i <= 256; i += 32) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
    var rnd = U.rnd(9721);
    for (var n = 0; n < 460; n++) {
      g.fillStyle = 'rgba(170,190,200,' + (rnd() * .055).toFixed(3) + ')';
      g.fillRect(rnd() * 256, rnd() * 256, 1.5, 1.5);
    }
    return c;
  }

  /* ---------- 剪影 ---------- */
  function face(g, x, y, r) {
    // 「同脸」：所有活物共用一张脸，只有体态暴露真相
    g.fillStyle = '#010305';

    g.strokeStyle = 'rgba(190,205,215,.3)'; g.lineWidth = .8; g.stroke();
    g.fillStyle = 'rgba(210,220,225,.45)';

    g.fillRect(x + r * .28, y - r * .1, 1.5, 1.5);
  }
  function bodyCentaur(g) {
    g.beginPath(); g.ellipse(-2, 4, 20, 10, 0, 0, 6.2832); g.fill();           // 马身
    g.fillRect(-16, 10, 4.5, 16); g.fillRect(-6, 11, 4.5, 15);
    g.fillRect(7, 11, 4.5, 15); g.fillRect(14, 10, 4.5, 16);                  // 四蹄
    g.beginPath(); g.moveTo(15, 0); g.lineTo(25, 12); g.lineTo(21, 14); g.lineTo(12, 4); g.fill();
    g.beginPath(); g.moveTo(-10, 2); g.lineTo(-4, -20); g.lineTo(6, -20); g.lineTo(10, 2); g.fill();
    g.fillRect(-9, -19, 3.5, 12); g.fillRect(5, -19, 3.5, 12);

  }
  function bodyMummy(g) {
    g.beginPath(); g.moveTo(-9, -18); g.lineTo(9, -18); g.lineTo(11, 20); g.lineTo(-11, 20); g.closePath(); g.fill();
    g.fillRect(-13, -16, 3.5, 22); g.fillRect(9, -16, 3.5, 22);
    g.fillRect(-7, 19, 5, 9); g.fillRect(2, 19, 5, 9);
    face(g, 0, -25, 7.5);
    g.strokeStyle = 'rgba(205,212,205,.42)'; g.lineWidth = 1.1;

  }

    g.beginPath(); g.moveTo(-8, -16); g.lineTo(8, -16); g.lineTo(9, 20); g.lineTo(-9, 20); g.closePath(); g.fill();
    g.fillRect(-12, -15, 3.5, 20); g.fillRect(8, -15, 3.5, 20);
    g.fillRect(-7, 19, 5, 10); g.fillRect(2, 19, 5, 10);
    face(g, 0, -23, 7);

    g.beginPath(); g.moveTo(-9, -14); g.lineTo(8, -18); g.lineTo(10, 20); g.lineTo(-10, 18); g.closePath(); g.fill();
    g.fillRect(-16, -12, 14, 3.5); g.fillRect(6, -16, 14, 3.5);

    g.save(); g.rotate(-.1);
    g.beginPath(); g.moveTo(-11, -18); g.lineTo(8, -15); g.lineTo(13, 21); g.lineTo(-8, 22); g.closePath(); g.fill();
    g.fillRect(-15, -14, 4, 26); g.fillRect(9, -13, 4, 22);

    py += bob;
    g.save();
    g.translate(px, py);
    g.globalAlpha = a.alpha;
    g.fillStyle = 'rgba(0,0,0,.55)';
    g.beginPath(); g.ellipse(0, 27 * s, 22 * s, 6 * s, 0, 0, 6.2832); g.fill();

    },
    hoof: function (near) {

<script>
/* 移动 / 感染数值 / 拟声字幕 / 恐怖调度 / 单机 AI 同伴 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config, S = G.DATA.script, U = G.utils;

  function hitWall(w, x, y, r) {
    for (var i = 0; i < w.walls.length; i++) {
      var b = w.walls[i];
      if (x > b.x - r && x < b.x + b.w + r && y > b.y - r && y < b.y + b.h + r) return true;
    }
    return false;
  }
  function moveWithCollision(w, e, dx, dy) {
    var nx = e.x + dx, ny = e.y + dy;
    if (!hitWall(w, nx, e.y, e.r)) e.x = nx;
    if (!hitWall(w, e.x, ny, e.r)) e.y = ny;
    e.x = U.clamp(e.x, C.world.pad, C.world.w - C.world.pad);
    e.y = U.clamp(e.y, C.world.pad, C.world.h - C.world.pad);
  }
  function keyboardRole(w, role) {
    return G.Game.mode === 'duo' || w.controlled === role;
  }

  /* ---------- movement ---------- */
  var Movement = G.Movement = {
    onPress: function (w, ev) {
      if (ev.code === 'ShiftLeft' && keyboardRole(w, 'p1')) Movement.dash(w, w.p1);
      if (ev.code === 'ShiftRight' && keyboardRole(w, 'p2')) Movement.dash(w, w.p2);
    },
    dash: function (w, e) {
      if (e.dashCd > 0 || w.time < 1) return;
      e.dashT = C.speed.dashTime; e.dashCd = C.speed.dashCd;
      w.infection = U.clamp(w.infection + C.infection.dash, 0, C.infection.max);
      w.stat.dashes++;
      G.Synth.hoof(true);
      G.Subtitles.push('咚——', 'onomat', .8);
    },
    update: function (w, dt) {
      var roles = ['p1', 'p2'];
      for (var i = 0; i < roles.length; i++) {
        var role = roles[i], e = G.World.playerOf(w, role);
        e.dashT = Math.max(0, e.dashT - dt);
        e.dashCd = Math.max(0, e.dashCd - dt);
        e.hitCd = Math.max(0, e.hitCd - dt);
        if (!keyboardRole(w, role)) continue;                  // 另一个交给 AI
        var a = G.Input.axis(role);

        // 「不能后退」：感染越深，反向分量被吞得越彻底
        var along = a.x * e.facing.x + a.y * e.facing.y;
        if (along < 0) {
          if (w.infection > C.noBack.sideOnly) { a.x = 0; a.y = 0; }
          else if (w.infection > C.noBack.free) {
            a.x -= along * e.facing.x; a.y -= along * e.facing.y;
            var l2 = Math.sqrt(a.x * a.x + a.y * a.y);

      var w = G.Game.world; if (!w) return;

    { t: 18, id: 'hoof', fn: function (w) { G.Subtitles.push(S.lines.hoofBehind, 'onomat', 2.4); G.Subtitles.push(S.lines.hoofHint, 'narration', 3.2); } },
    { t: 50, id: 'silence1', fn: function (w) { G.Audio.muteAll(C.silence.long); G.Subtitles.push(S.lines.sameFace, 'narration', 3); } },
    { t: 118, id: 'echo', fn: function (w) { G.Subtitles.push(S.lines.echoes[0], 'onomat', 2.4); G.Synth.secret(false); } },
    { t: 170, id: 'silence2', fn: function (w) {

        var sh = G.Entities.make({ kind: 'follower', x: w.p1.x - 130, y: w.p1.y + 10, trueForm: 'centaur', r: 21, follower: true });
        G.World.add(w, sh); w.followers.push(sh);
        G.Subtitles.push('身后多了一个不动的影子。', 'narration', 3);
      } },
    { t: 220, id: 'mapShift', fn: function (w) {
        w.flags.mapShifted = true;

        G.Subtitles.push(S.lines.mapShift, 'narration', 3.4);
        G.Synth.glitch();
      } },
    { t: 240, id: 'escape', fn: function (w) {
        w.flags.escape = true;
        if (G.State.current !== 'RESULT' && G.State.current !== 'CHOICE') G.State.set('ESCAPE');

        if (w.time >= ev.t && !D[ev.id]) { D[ev.id] = true; ev.fn(w); }
      }
      w.horror.flicker = Math.sin(w.time * 9) * .5 + .5;
    }
  };

  /* ---------- AI companion（单机） ---------- */
  G.AI = {
    update: function (w, dt) {
      if (G.Game.mode === 'duo') return;
      var ai = w.controlled === 'p1' ? w.p2 : w.p1;
      var human = w.controlled === 'p1' ? w.p1 : w.p2;
      var d = U.dist(ai, human);
      if (d > 96) {
        var vx = (human.x - ai.x) / d, vy = (human.y - ai.y) / d;
        moveWithCollision(w, ai, vx * 152 * dt, vy * 152 * dt);
        ai.facing.x = vx; ai.facing.y = vy; ai.moving = true;
      } else ai.moving = false;

      // 相认阶段的「报数」已在 Recognition.begin 里同步完成；
      // AI 只负责跟随、避障与行为测试，不替玩家下认错结论。

      // 行为测试：只有真爱人会挡在丧尸前面
      if (w.recog.stage === 'VERIFY' && !w.flags.blocked && w.suspectId) {
        var lover = w.byId[w.suspectId];
        if (lover && lover.alive && U.dist(lover, human) < 260) {
          var x = (human.x + lover.x) / 2 - 30, y = (human.y + lover.y) / 2;
          moveWithCollision(w, lover, (x - lover.x) * .9 * dt, (y - lover.y) * .9 * dt);
          if (U.dist(lover, human) < 86) {
            w.flags.blocked = true;
            w.humanity = U.clamp(w.humanity + C.humanity.block, 0, 100);
            G.Subtitles.push(S.lines.block, 'narration', 3.6);
          }
        }
      }
    }
  };
})();

</script>
<script>
/* 相认三技巧：分屏坐标锁定 / 节奏暗号 QTE（回声模仿） / 倒影 + 行为测试 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config, S = G.DATA.script, U = G.utils;

  function sideMode(mode) { return mode === 'mummy' ? 'mummy' : 'centaur'; }
  function listFor(w, mode) { return G.Perception.movers(w, sideMode(mode)); }

  var R = G.Recognition = {
    reset: function (w) {
      w.recog = { stage: 'IDLE', p1Pick: 1, p2Pick: 1, aiK: 0, attempts: 0, mistakes: 0, verifyDone: false, reported: { p1: false, p2: false } };
      w.qte = { active: false, idx: 0, t0: 0, echoFollow: 0, echoAt: [], hits: [], targetIsFake: false, result: null };
      w.aiReport = null; w.lockedId = null;
    },
    indexFor: function (w, mode, id) {
      if (!w || w.recog.stage !== 'LOCK') return 0;
      var ms = listFor(w, mode);
      for (var i = 0; i < ms.length; i++) if (ms[i].id === id) return i + 1;
      return 0;
    },
    isPicked: function (w, mode, id) {
      if (!w || w.recog.stage !== 'LOCK') return false;
      var ms = listFor(w, mode);
      var k = (mode === 'mummy')
        ? (G.Game.mode === 'duo' ? w.recog.p2Pick : w.recog.aiK)
        : w.recog.p1Pick;
      return !!ms[k - 1] && ms[k - 1].id === id;
    },
    begin: function (w) {
      if (w.recog.stage !== 'IDLE') return;
      w.recog.stage = 'LOCK';
      w.recog.reported = { p1: false, p2: G.Game.mode === 'duo' ? false : true };
      G.State.set('RECOGNIZE');
      G.Subtitles.push(S.lines.candidates, 'narration', 4);
      G.Subtitles.push(S.lines.reportTip, 'narration', 4.6);
      // AI 报数在 begin 时同步算好，不依赖下一帧，避免快速操作吞输入
      if (G.Game.mode === 'solo') {
        var ms = G.Perception.movers(w, 'mummy'), k = 0;
        for (var i = 0; i < ms.length; i++) if (ms[i].id === w.suspectId) k = i + 1;
        k = k || 1;
        w.aiReport = k; w.recog.aiK = k;
        G.Subtitles.push(S.lines.aiReport.replace('{k}', k), 'who', 6);
        G.Subtitles.push('她看到的顺序，和你相反。', 'narration', 4);
      }
      G.Synth.bandage();
    },
    onPress: function (w, ev) {
      if (!w) return;
      var st = w.recog.stage;
      if (st === 'LOCK') {
        var n = listFor(w, 'centaur').length || 1;
        if (ev.code === 'KeyQ') { w.recog.p1Pick = w.recog.p1Pick % n + 1; G.Synth.secret(true); }
        else if (ev.code === 'KeyE' && G.Game.mode === 'duo') {
          var n2 = listFor(w, 'mummy').length || 1;
          w.recog.p2Pick = w.recog.p2Pick % n2 + 1; G.Synth.secret(true);
        }
        else if (ev.code === 'KeyF') { w.recog.reported.p1 = true; G.Synth.secret(true); }
        else if (ev.code === 'Enter' && G.Game.mode === 'duo') { w.recog.reported.p2 = true; G.Synth.secret(true); }
        if (w.recog.reported.p1 && w.recog.reported.p2) R.exchangeLock(w);
        return;
      }
      if (st === 'QTE' && w.qte.active) {
        if (ev.code === 'Space' || ev.code === 'Enter') R.qteHit(w, ev.t);
        return;
      }
      if (st === 'VERIFY' && ev.code === 'KeyR') R.mirror(w);
    },
    update: function (w, dt) {
      if (!w) return;
      if (w.qte.active) {
        var q = w.qte;
        var deadline = q.t0 + C.qte.pattern[C.qte.pattern.length - 1] + C.qte.window + .45;
        if (U.now() > deadline && !q.result) R.qteResolve(w, 'FAIL');
      }
    },

    /* 技巧②：两侧各报「第几个在动」，只有指向同一实体才算数 */
    exchangeLock: function (w) {
      var m1 = listFor(w, 'centaur'), m2 = listFor(w, 'mummy');
      var k2 = G.Game.mode === 'duo' ? w.recog.p2Pick : w.recog.aiK;
      var a = m1[w.recog.p1Pick - 1], b = m2[k2 - 1];
      w.recog.reported = { p1: false, p2: G.Game.mode === 'duo' ? false : true };
      w.recog.attempts++;
      if (!a || !b || a.id !== b.id) {
        G.Subtitles.push(S.lines.lockFail, 'narration', 2.4);
        G.Synth.glitch();
        if (w.recog.attempts >= 3) G.Infection.applyMistake(w, true);
        return;
      }
      w.lockedId = a.id;
      if (w.byId[a.id]) w.byId[a.id].locked = true;
      G.Subtitles.push(S.lines.lockOk, 'narration', 2.4);
      G.Synth.secret(true);
      R.startQTE(w, !a.isLover);
    },

    /* 技巧①：三短一长；假象慢半拍回声模仿，跟错就被带偏 */
    startQTE: function (w, targetIsFake) {
      w.recog.stage = 'QTE';
      G.State.set('QTE');
      w.qte = {
        active: true, idx: 0, t0: U.now() + C.qte.lead,
        echoFollow: 0, echoAt: [], hits: [], targetIsFake: targetIsFake, result: null
      };
      G.Subtitles.push(S.lines.qteTip, 'narration', 4.2);
      G.Synth.secret(true);
      G.UI.showQTE(w);
    },
    qteHit: function (w, t) {
      var q = w.qte;
      if (!q.active || q.result) return;
      // 先判「是不是跟着回声按的」
      for (var i = 0; i < q.echoAt.length; i++) {
        if (Math.abs(t - q.echoAt[i]) <= C.qte.echoTolerance + C.qte.window * .5) {
          q.echoFollow++;
          G.Synth.glitch();
          G.Subtitles.push(S.lines.qteEcho, 'onomat', 1.6);
          if (q.echoFollow >= C.qte.echoMax) return R.qteResolve(w, 'MISLED');
          return;
        }
      }
      var exp = q.t0 + C.qte.pattern[q.idx];
      if (Math.abs(t - exp) <= C.qte.window) {
        q.hits.push(q.idx); q.idx++;
        G.Synth.secret(!q.targetIsFake);
        if (q.targetIsFake) {
          var at = t + C.qte.echoDelay;
          q.echoAt.push(at);
          setTimeout(function () { if (!q.result) G.Synth.secret(false); }, C.qte.echoDelay * 1000);
        }
        if (q.idx >= C.qte.pattern.length) return R.qteResolve(w, 'SUCCESS');
      } else {
        G.Synth.glitch();
        return R.qteResolve(w, 'FAIL');
      }
    },
    qteResolve: function (w, result) {
      var q = w.qte;
      if (q.result) return;
      q.result = result; q.active = false;
      G.UI.hideQTE();
      if (result === 'SUCCESS' && q.targetIsFake) {
        // 没被回声带偏 = 识破假象，回去重选
        G.Subtitles.push('它慢了半拍。不是她。', 'narration', 2.8);
        if (w.byId[w.lockedId]) w.byId[w.lockedId].locked = false;
        w.lockedId = null;
        w.recog.stage = 'LOCK'; G.State.set('RECOGNIZE');
        w.recog.reported = { p1: false, p2: G.Game.mode === 'duo' ? false : true };
        return;
      }
      if (result === 'SUCCESS') {
        w.flags.recognized = true;
        w.humanity = U.clamp(w.humanity + C.humanity.correct, 0, 100);
        G.Subtitles.push(S.lines.qteClean, 'narration', 2.6);
      } else {
        G.Infection.applyMistake(w);
        w.flags.wrongPerson = true;
        G.Subtitles.push(result === 'MISLED' ? S.lines.misled : '暗号没对上。它记住了你的样子。', 'narration', 3);
      }
      R.toVerify(w);
    },
    toVerify: function (w) {
      w.recog.stage = 'VERIFY';
      G.State.set('VERIFY');
      G.Subtitles.push(S.lines.verifyTip, 'narration', 4.5);
    },

    /* 技巧③：水坑倒影不撒谎（行为测试由 AI 同伴在 systems.js 里触发） */
    mirror: function (w) {
      var near = w.puddles.some(function (p) { return U.dist(p, w.p1) < 240 || U.dist(p, w.p2) < 240; });
      if (!near) { G.Subtitles.push('要站在水洼边，才看得见倒影。', 'system', 2); return; }
      w.flags.mirrorReveal = true;
      var trueOne = w.lockedId && w.lockedId === w.suspectId && !w.flags.wrongPerson;
      if (trueOne) {
        G.Subtitles.push(S.lines.mirrorTrue, 'narration', 3.2);
        G.Synth.secret(true);
      } else {
        w.flags.wrongPerson = true;
        G.Infection.applyMistake(w, true);
        G.Subtitles.push(S.lines.mirrorFake, 'narration', 3.2);
        G.Synth.glitch();
      }
      w.flags.verifyDone = true;
      w.recog.stage = 'DONE';
      G.State.set('ESCAPE');
      G.Subtitles.push(S.lines.serum + ' 往右，去发射通道。', 'narration', 4);
    },
    forceVerify: function (w) {
      if (w.flags.verifyDone) return;
      w.qte.active = false; G.UI.hideQTE();
      w.flags.verifyDone = true;
      w.recog.stage = 'DONE';
      G.State.set('ESCAPE');
      G.Subtitles.push('没时间验证了。往右冲。', 'narration', 2.6);
    }
  };
})();

</script>

  /* 时间轴：阶段推进的保底（玩家操作优先，避免展示时卡住） */

<script>
/* HUD（会撒谎）/ 拟声字幕 / QTE 节奏条 / 标题·剧情·抉择·结局卡 */
(function () {
  var G = window.G = window.G || {};
  var C = G.DATA.config, S = G.DATA.script, U = G.utils;
  var D = {};

  function html(s) { return String(s).replace(/\n/g, '<br>'); }

  var UI = G.UI = {
    init: function () {
      ['hud-left', 'hud-right', 'split-line', 'prompt', 'subtitles', 'overlay', 'card',
        'qte', 'qte-cursor', 'qte-beats', 'qte-hint', 'flash',
        'bar-inf-a', 'bar-inf-b', 'bar-hum-a', 'bar-hum-b',
        'num-inf-a', 'num-inf-b', 'num-hum-a', 'num-hum-b', 'hud-foot-a', 'hud-foot-b']
        .forEach(function (id) { D[id] = U.el(id); });
      G.Events.on('silence', function (on) {
        D.flash.classList.toggle('on', !!on);
        if (on) setTimeout(function () { D.flash.classList.remove('on'); }, 240);
      });
      G.Events.on('truth', function () {
        D.flash.classList.add('on');
        setTimeout(function () { D.flash.classList.remove('on'); }, 700);
      });
    },
    overlay: function (kind, key) {
      var c = D.card;
      if (!kind) { D.overlay.classList.remove('show'); return; }
      var out = '';
      if (kind === 'title') {
        out = '<h1>' + S.title + '</h1><div class="sub">' + S.subtitle + ' · ' + S.theme + '</div>'
          + S.premise.map(function (p) { return '<p>' + p + '</p>'; }).join('')
          + '<div class="go">按 任 意 键 继 续</div>';
      } else if (kind === 'brief') {
        var keys = S.keys.map(function (k) { return '<div><b>' + k[0] + '</b><br>' + k[1] + '</div>'; }).join('');
        out = '<h2>末 日 第 四 十 一 天</h2>'
          + S.brief.map(function (p) { return '<p>' + p + '</p>'; }).join('')
          + '<div class="keys">' + keys + '</div>'
          + '<div class="go">按 1 单 机（AI 同伴）　/　按 2 双 人 同 屏</div>';
      } else if (kind === 'choice') {
        out = '<h2>' + S.lines.choiceTitle + '</h2><p>' + S.lines.choiceSub + '</p>'
          + S.lines.choiceOpts.map(function (o) { return '<div class="opt">' + html(o) + '</div>'; }).join('')
          + '<div class="go">按 1 / 2 / 3 选 择</div>';
      } else if (kind === 'ending') {
        var e = S.endings[key] || S.endings.timeout;
        var w = G.Game.world;
        out = '<h2>' + e.name + '</h2><div class="ending">' + html(e.text) + '</div>'
          + '<div class="stat">用时 ' + U.fmt(w ? w.time : 0)
          + ' · 感染 ' + Math.round(w ? w.infection : 0)
          + ' · 人性 ' + Math.round(w ? w.humanity : 0)
          + ' · 认错 ' + (w ? w.stat.mistakes : 0) + ' 次</div>'
          + '<div class="go">按 R 回 到 标 题</div>';
      }
      c.innerHTML = out;
      D.overlay.classList.add('show');
    },
    showQTE: function (w) { D.qte.classList.remove('hidden'); UI.qteBeats(w); },
    hideQTE: function () { D.qte.classList.add('hidden'); },
    qteBeats: function (w) {
      var q = w.qte, span = C.qte.lead + C.qte.pattern[3] + .4;
      var s = '';
      for (var i = 0; i < C.qte.pattern.length; i++) {
        var pct = (C.qte.lead + C.qte.pattern[i]) / span * 100;
        var cls = q.hits.indexOf(i) >= 0 ? ' hit' : (q.result && q.result !== 'SUCCESS' ? ' miss' : '');
        s += '<div class="qte-beat' + cls + '" style="left:' + pct.toFixed(2) + '%"></div>';
      }
      for (var j = 0; j < q.echoAt.length; j++) {
        var ep = (C.qte.lead + (q.echoAt[j] - q.t0)) / span * 100;
        if (ep > 0 && ep < 100) s += '<div class="qte-beat echo" style="left:' + ep.toFixed(2) + '%"></div>';
      }
      D['qte-beats'].innerHTML = s;
    },
    update: function (w) {
      var duo = (G.Game.mode === 'duo' || G.Game.dualView);
      D['split-line'].classList.toggle('off', !duo);
      D['hud-right'].classList.toggle('off', !duo);
      D['hud-left'].classList.toggle('off', G.State.current === 'TITLE' || G.State.current === 'BRIEF');

      // HUD 偶尔撒谎：感染越深越不可信
      var lie = w.infection > 38 && (Math.floor(w.time * 1.3) % 11 === 0);
      var inf = Math.round(w.infection), hum = Math.round(w.humanity);
      D['bar-inf-a'].style.width = inf + '%'; D['bar-inf-b'].style.width = inf + '%';
      D['bar-hum-a'].style.width = hum + '%'; D['bar-hum-b'].style.width = hum + '%';
      D['num-inf-a'].textContent = lie ? '??' : inf;
      D['num-inf-b'].textContent = lie ? '1??' : inf;
      D['num-hum-a'].textContent = lie ? '??' : hum;
      D['num-hum-b'].textContent = lie ? '??' : hum;
      D['hud-foot-a'].textContent = '血清 ×' + w.serum + ' · ' + U.fmt(w.time);
      D['hud-foot-b'].textContent = lie ? S.lines.hudLies[3] : '共用一条命';

      // 字幕
      D.subtitles.innerHTML = w.subs.map(function (s) {
        var cls = s.kind === 'onomat' ? 'onomat' : (s.kind === 'who' ? 'who' : '');
        return '<div class="line ' + cls + '">' + html(s.text) + '</div>';
      }).join('');

      // 阶段提示
      var pr = '', st = w.recog.stage, ph = G.State.current;
      if (ph === 'PLAY') pr = '找血清 · 注意身后的蹄声';
      else if (st === 'LOCK') {
        pr = G.Game.mode === 'duo'
          ? 'A：Q 选 / F 报数　　B：E 选 / Enter 报数'
          : '按 Q 选「第几个在动」，按 F 报数　·　同伴报的是第 ' + (w.recog.aiK || '?') + ' 个';
      } else if (st === 'QTE') pr = '跟着亮点敲：三短一长　·　别跟慢半拍的回声';
      else if (st === 'VERIFY') pr = '走到水洼边，按 R 看倒影';
      else if (st === 'DONE' || ph === 'ESCAPE') pr = '往右冲 · 去发射通道 · 不能后退';
      D.prompt.textContent = pr;

      // QTE 节奏条
      if (w.qte.active) {
        var q = w.qte, span = C.qte.lead + C.qte.pattern[3] + .4;
        var p = U.clamp((U.now() - (q.t0 - C.qte.lead)) / span, 0, 1);
        D['qte-cursor'].style.left = (p * 100).toFixed(2) + '%';
        UI.qteBeats(w);
        D['qte-hint'].textContent = (q.targetIsFake ? '有东西在学你 · ' : '') +
          '已敲 ' + q.idx + '/4 · 跟回声 ' + q.echoFollow + '/' + C.qte.echoMax +
          ' · 按 空格 / Enter';
      }
    }
  };
})();

</script>
<script>
/* 启动入口：必须放在所有模块之后 */
(function () {
  function start() { G.Game.init(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
