<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>眼中皆是你 · 恐怖 / 即时动作 / 马</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="游戏画面"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="split-line" aria-hidden="true"></div>

  <div class="hud hud-left" id="hud-left">
    <div class="hud-tag">A · 人马</div>
    <div class="hud-row"><span>感染</span><div class="bar"><i id="bar-inf-a"></i></div><b id="num-inf-a">0</b></div>
    <div class="hud-row"><span>人性</span><div class="bar bar-h"><i id="bar-hum-a"></i></div><b id="num-hum-a">100</b></div>
    <div class="hud-foot" id="hud-foot-a">血清 ×2 · 00:00</div>
  </div>

  <div class="hud hud-right" id="hud-right">
    <div class="hud-tag">B · 木乃伊</div>
    <div class="hud-row"><span>感染</span><div class="bar"><i id="bar-inf-b"></i></div><b id="num-inf-b">0</b></div>
    <div class="hud-row"><span>人性</span><div class="bar bar-h"><i id="bar-hum-b"></i></div><b id="num-hum-b">100</b></div>
    <div class="hud-foot" id="hud-foot-b">共用一条命</div>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="subtitles" class="subtitles"></div>

  <div id="qte" class="qte hidden">
    <div class="qte-title">暗号 · 三短一长 <span id="qte-sub">跟着亮点敲</span></div>
    <div class="qte-track"><div class="qte-cursor" id="qte-cursor"></div><div class="qte-beats" id="qte-beats"></div></div>
    <div class="qte-hint" id="qte-hint"></div>
  </div>

  <div id="overlay" class="overlay">
    <div class="card" id="card"></div>
  </div>
  <div id="flash" class="flash"></div>
</div>

<script src="data/config.js"></script>
<script src="data/script.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/systems.js"></script>
<script src="js/recognition.js"></script>
<script src="js/levels.js"></script>
<script src="js/ui.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
